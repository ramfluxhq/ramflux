[package]
name = "ramflux-card"
autoexamples = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
c-abi = []
compiler = []
web = ["dep:wasm-bindgen"]

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "properties"] }
rquickjs-core = { version = "=0.14.0", default-features = false }
rquickjs-sys = "=0.14.0"
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
web-time = "=1.1.0"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "properties", "bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.126", optional = true }

[lints]
workspace = true

[build-dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "time", "process", "io-util"] }

[[bin]]
name = "card-pack"
path = "examples/card-pack.rs"
required-features = ["compiler"]

[package.metadata.cargo-machete]
# Pin the complete bytecode engine graph; wrapper semver must never change the engine.
ignored = ["rquickjs-core", "rquickjs-sys"]
