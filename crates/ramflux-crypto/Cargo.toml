[package]
name = "ramflux-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license.workspace = true
repository = "https://github.com/ramflux/ramflux-crypto"

[dependencies]
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-core = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-protocol = { workspace = true }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# Direct 0.11 pin so hpke's AES-256/GHASH keys unify with `zeroize` (P03 M2).
aes-gcm-hpke = { package = "aes-gcm", version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }
argon2 = "0.5.3"
bip39 = { version = "=3.0.0", default-features = false, features = ["std", "zeroize"] }
unicode-normalization = "0.1.25"
hkdf = "0.13"
base64 = "0.22"
blake3 = "1.8.5"
chacha20poly1305 = "0.10.1"
chacha20 = { version = "0.9", features = ["zeroize"] }
poly1305 = { version = "0.8", features = ["zeroize"] }
ed25519-dalek = { workspace = true, features = ["batch", "zeroize"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.13"
hpke = { version = "=0.14.1", default-features = false, features = ["x25519", "aes", "alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = "0.8"
sha2 = "0.11"
subtle = { workspace = true }
thiserror = "2.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
curve25519-dalek = "5.0.0"
