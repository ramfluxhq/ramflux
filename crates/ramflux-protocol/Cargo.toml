[package]
name = "ramflux-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license.workspace = true
repository = "https://github.com/ramflux/ramflux-protocol"

[dependencies]
prost.workspace = true
prost-reflect = "=0.16.5"
unicode-segmentation = "=1.13.3"
pbjson = "=0.9.0"
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-core = { workspace = true }
base64 = "0.22"
blake3 = "1.8.5"
ed25519-dalek = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
thiserror = "2.0"
unicode-case-mapping = "=1.0.0"
unicode-general-category = "=1.1.0"
unicode-normalization = "0.1.25"
unicode-security = "=0.1.3"
zeroize.workspace = true

[dev-dependencies]
ramflux-test-support.workspace = true
insta = "1.47.2"
quote = "=1.0.47"
syn = { version = "=2.0.117", features = ["full", "visit"] }

[lints]
workspace = true
