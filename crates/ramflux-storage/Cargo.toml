[package]
name = "ramflux-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license.workspace = true
repository = "https://github.com/ramflux/ramflux-storage"

[dependencies]
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-core = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-crypto = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-protocol = { workspace = true }
fs2 = "0.4"
zeroize = "1.8"
# Search pins Unicode 16 separately; existing protocol normalization stays unchanged.
search-normalization = { package = "unicode-normalization", version = "=0.1.24", git = "https://github.com/unicode-rs/unicode-normalization", rev = "c9921309f09ebd05108920fda92efbf5f8124a7d" }
search-segmentation = { package = "unicode-segmentation", version = "=1.12.0", git = "https://github.com/unicode-rs/unicode-segmentation", rev = "9e3f88c06ca275294ef4cb1daf0789f06a28611d" }
caseless = "=0.2.2"
blake3 = "1.8.5"
hkdf = { workspace = true }
hmac = { workspace = true, features = ["zeroize"] }
sha2 = { workspace = true, features = ["zeroize"] }
subtle = { workspace = true }
chacha20poly1305 = "0.10.1"
rusqlite = { version = "0.42", default-features = false, features = ["backup", "blob", "cache", "fallible_uint", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[features]
# Opt-in counters for integration-test complexity proofs; disabled in production.
itest-work-budget = []
default = ["sqlcipher"]
sqlcipher = ["rusqlite/bundled-sqlcipher"]
durability-test-hooks = []
test-instrumentation = ["rusqlite/hooks"]
insecure-test-sqlite = ["rusqlite/bundled"]

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "process", "io-util", "time"] }
ramflux-test-support.workspace = true
tempfile.workspace = true
ed25519-dalek.workspace = true
rusqlite = { version = "0.42", default-features = false, features = ["trace", "hooks", "cache", "fallible_uint"] }
