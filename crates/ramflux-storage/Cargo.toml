[package]
name = "ramflux-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license.workspace = true
repository = "https://github.com/ramflux/ramflux-storage"

[dependencies]
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-core = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-crypto = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-protocol = { workspace = true }
fs2 = "0.4"
zeroize = "1.8"
blake3 = "1.8.5"
hkdf = { workspace = true }
hmac = { workspace = true, features = ["zeroize"] }
sha2 = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
rusqlite = { version = "0.42", default-features = false, features = ["backup", "blob", "cache", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[features]
# Opt-in counters for integration-test complexity proofs; disabled in production.
itest-work-budget = []
default = ["sqlcipher"]
sqlcipher = ["rusqlite/bundled-sqlcipher"]
durability-test-hooks = []
test-instrumentation = ["rusqlite/hooks"]
insecure-test-sqlite = ["rusqlite/bundled"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
ed25519-dalek.workspace = true
rusqlite = { version = "0.42", default-features = false, features = ["trace", "hooks", "cache", "fallible_uint"] }
