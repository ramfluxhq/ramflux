[package]
name = "ramflux-node-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.ramflux]
commercial-license = true

[features]
test-support = []
default = []
durability-test-hooks = []
itest-http = []
# RELAY-MEM-03-A0b (CTRL-093) DIAGNOSTIC/probe-only (default-off): enables redb's `cache_metrics`
# and unlocks a fixed redb page-cache cap (via `RAMFLUX_RELAY_REDB_CACHE_BYTES`) + a `cache_stats`
# accessor for the 1 GiB-control-vs-32 MiB-candidate experiment. NEVER in the default/production
# build: without it `RelayRedbStore::open` reads no env, overrides nothing (redb's 1 GiB default),
# and exposes no cache-stats surface. Enabled explicitly for a probe run via run-realnet.sh.
itest-redb-cache-probe = ["redb/cache_metrics"]

[dependencies]
tempfile = "3"
fs2 = "0.4"
blake3.workspace = true
ed25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
arc-swap = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-crypto = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-protocol = { workspace = true }
crc32fast = { workspace = true }
redb = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = { workspace = true }
postcard = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
signal-hook = { workspace = true }
thiserror = "2.0"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
ramflux-core = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
ramflux-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
curve25519-dalek = "5.0.0"
ed25519-dalek = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }

[lints]
workspace = true
