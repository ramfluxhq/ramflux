[package]
name = "ramflux-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent one-to-one voice media engine"

[dependencies]
# RFC 9605 suites: AES-GCM with HKDF. The zeroize feature matches ramflux-crypto.
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
# Reference libopus, built from the bundled sources (cmake and a C compiler).
opus = "0.4"
ramflux-crypto = { workspace = true }

[dev-dependencies]
ramflux-protocol = { workspace = true }

[lints]
workspace = true

[features]
# CALLS-VIDEO V2.2b real run only: a fixed synthetic video source feeds the send loop. Enabled by
# the SDK feature of the same name, which refuses production and release builds.
itest-synthetic-video = []
