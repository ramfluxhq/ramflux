language = "C"
line_endings = "LF"
header = "/* SPDX-License-Identifier: BSD-3-Clause */"
after_includes = "#ifdef RAMFLUX_WITH_CARD_RUNTIME\n#include \"ramflux_card.h\"\n#endif"
include_guard = "RAMFLUX_SDK_H"
pragma_once = true
style = "tag"
usize_is_size_t = true
documentation = true
documentation_style = "c"
cpp_compat = true

[parse]
parse_deps = false
include = ["ramflux-sdk"]

[export]
include = ["RamfluxErrorCode", "RamfluxV2Status", "RamfluxV2CustodyOperation"]
item_types = ["enums", "structs", "functions", "opaque", "typedefs"]
exclude = [
  "CAbiClientInner",
  "CAbiEventQueue",
  # Private Apple clock FFI (platform/clock_apple.rs): cbindgen parses it on every host.
  "Timebase",
  "mach_continuous_time",
  "mach_timebase_info",
]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
