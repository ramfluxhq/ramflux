[package]
name = "ramflux-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license.workspace = true
repository = "https://github.com/ramflux/ramflux-sdk"
build = "build.rs"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Integration fixture only; production provenance forbids this feature.
itest-memory-vault = []
test-support = []
# Seed-taking account creation for unmigrated integration fixtures only.
itest-legacy-accounts = []
# Default-off short registration-proof lifetime for integration tests only.
itest-identity-proof = []
c-abi = ["dep:ramflux-client-model"]
# Bundle the independently versioned renderer into this same Rust library.
card-runtime = ["c-abi", "dep:ramflux-card", "ramflux-card/c-abi"]
# Read-only introspection for realnet integration tests (T21-A2a / CTRL-028). Never enabled by
# production binaries; exposes recv-commit checkpoints/cursor as evidence, no control or mutation.
itest-fingerprint = ["ramflux-transport/itest-fingerprint"]
# T24-B2: rfd mid-flight crash-resume itest. Compile-time gate for a post-local-commit /
# pre-remote barrier seam used only by mvp_s63 to SIGKILL `rf daemon start` at a durable-commit
# boundary. Never enabled by production binaries — default SDK/rf carry no fault mode/marker env
# strings, symbols, or park code. Still requires the runtime opt-in env to arm (double gate).
itest-rfd-fault = []
# T25-A2 (OBJ-IPC-01) P0-2: local-bus response-loss seam used only by mvp_s66 to drop the
# object.put response AFTER the operation is durably Committed, forcing the CLI to reconcile via
# object.put.status. Never enabled by production binaries; requires the runtime opt-in env (double
# gate); marker=0 in production.
itest-bus-fault = []
# Default-off startup-restore gate for integration tests that pin observable state ordering.
itest-restore-state = []
# T25-A5 (OBJ-IPC-01): default-off object-IPC crash seam used only by mvp_s69 to abort() rfd at the
# upload chunk d->e boundary (durable spool + journal fsync'd, before the ack) and the download
# after-spool-write boundary. Never enabled by production binaries; requires the runtime opt-in env
# (double gate); marker=0 in production.
object-ipc-crash-seam = []
# S6b P11f2: commit-cut observer seam (storage durability hooks) for the task courier refusal
# tests only. Opt-in per build; the production-absence variant never enables it, and storage
# refuses it under RAMFLUX_PRODUCTION_BUILD.
durability-test-hooks = ["ramflux-storage/durability-test-hooks"]

[dependencies]
ramflux-client-model = { path = "../ramflux-client-model", optional = true }
ramflux-card = { path = "../ramflux-card", optional = true }
ed25519-dalek.workspace = true
prost.workspace = true
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-protocol = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-crypto = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-storage = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-transport = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-sync = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
aes-gcm = "0.10"
fs2 = "0.4"
getrandom = { workspace = true }
mime = "0.3"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3.51", features = ["formatting"] }
tokio = { version = "1.42", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1"
zeroize = { version = "1.8", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust", "vendored"] }
chacha20poly1305 = { version = "=0.10.1" }
chacha20 = { version = "=0.9.1", features = ["zeroize"] }
poly1305 = { version = "=0.8.0", features = ["zeroize"] }

[target.'cfg(windows)'.dependencies]
# Named-pipe carrier, owner-only files, known folders and DPAPI: calls the standard library does
# not expose.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
# Mobile SDKs do not ship libcrypto. Package SQLCipher's crypto dependency with the core library.
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
ramflux-test-support.workspace = true
serde_json = { version = "1.0", features = ["raw_value"] }
ramflux-storage = { workspace = true, features = ["test-instrumentation", "itest-work-budget"] }
rusqlite = { workspace = true }
ramflux-node-core = { workspace = true, features = ["test-support"] }
rcgen = { workspace = true }
quinn = { workspace = true }
tokio = { version = "1.42", features = ["test-util"] }
tempfile.workspace = true

[build-dependencies]
cbindgen = "=0.29.4"
serde_json = "1.0"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.17.0", features = ["OSX_10_15"] }
