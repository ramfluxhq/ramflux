[package]
name = "ramflux-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license.workspace = true
repository = "https://github.com/ramflux/ramflux-sdk"
build = "build.rs"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Integration fixture only; production provenance forbids this feature.
itest-memory-vault = []
# Seed-taking account creation for unmigrated integration fixtures only.
itest-legacy-accounts = []
# Default-off short registration-proof lifetime for integration tests only.
itest-identity-proof = []
c-abi = []
# Read-only introspection for realnet integration tests (T21-A2a / CTRL-028). Never enabled by
# production binaries; exposes recv-commit checkpoints/cursor as evidence, no control or mutation.
itest-fingerprint = []
# T22-A1 / RQ-04: legacy v2 shared-HMAC relay-token local minting. Compile-time gate for the itest
# LocalMint compatibility path; still requires the runtime opt-in env to activate (double gate).
# Never enabled by production binaries — default SDK/rf carry no HMAC mint code, service-key env, or
# LocalMint env. The v3 GatewayIssued path is unaffected.
itest-local-mint = ["dep:hmac", "dep:sha2"]
# T24-B2: rfd mid-flight crash-resume itest. Compile-time gate for a post-local-commit /
# pre-remote barrier seam used only by mvp_s63 to SIGKILL `rf daemon start` at a durable-commit
# boundary. Never enabled by production binaries — default SDK/rf carry no fault mode/marker env
# strings, symbols, or park code. Still requires the runtime opt-in env to arm (double gate).
itest-rfd-fault = []
# T25-A2 (OBJ-IPC-01) P0-2: local-bus response-loss seam used only by mvp_s66 to drop the
# object.put response AFTER the operation is durably Committed, forcing the CLI to reconcile via
# object.put.status. Never enabled by production binaries; requires the runtime opt-in env (double
# gate); marker=0 in production.
itest-bus-fault = []
# T25-A5 (OBJ-IPC-01): default-off object-IPC crash seam used only by mvp_s69 to abort() rfd at the
# upload chunk d->e boundary (durable spool + journal fsync'd, before the ack) and the download
# after-spool-write boundary. Never enabled by production binaries; requires the runtime opt-in env
# (double gate); marker=0 in production.
object-ipc-crash-seam = []

[dependencies]
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-protocol = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-crypto = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-storage = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-transport = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-sync = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
aes-gcm = "0.10"
fs2 = "0.4"
getrandom = { workspace = true }
rustix = { version = "1.1", features = ["fs"] }
mime = "0.3"
blake3 = "1.5"
# Only used by the itest-local-mint v2 HMAC relay-token minting path; optional so production
# SDK/rf binaries do not link the HMAC implementation.
hmac = { version = "0.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only used (via hmac) by the itest-local-mint v2 relay-token minting path.
sha2 = { version = "0.10", optional = true }
thiserror = "2.0"
tokio = { version = "1.42", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
zeroize = { version = "1.8", features = ["serde"] }

[dev-dependencies]
ramflux-node-core = { workspace = true }
rcgen = { workspace = true }
tokio = { version = "1.42", features = ["test-util"] }
tempfile = "3"

[build-dependencies]
cbindgen = "0.29.3"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "deny"
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
