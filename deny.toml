[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# P3 keeps the dependency graph unchanged. These unmaintained-crate advisories
# are tracked as explicit follow-up migration work instead of silently hidden.
ignore = [
    "RUSTSEC-2023-0089", # atomic-polyfill via postcard/heapless
    "RUSTSEC-2025-0134", # rustls-pemfile direct PEM loader dependency
    "RUSTSEC-2026-0441", # pin-utils unmaintained (not a vulnerability); transitive via nix 0.26 <- webrtc-util 0.17 (stun/turn in ramflux-signaling); drop when webrtc-util moves off nix 0.26
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# rusqlite 0.41 bundled-sqlcipher uses sqlcipher-src (SQLCipher amalgamation +
# SQLite blessing + libtomcrypt WTFPL). MIT/BSD-3-Clause of that crate already
# match the allow list; the two extra licenses are crate-scoped.
exceptions = [
    { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
