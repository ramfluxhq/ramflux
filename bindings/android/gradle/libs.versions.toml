#
# Every version is pinned. Sources checked on 2026-11-12:
#   agp / gradle / ndk   developer.android.com/build/releases/gradle-plugin (AGP 9.5.1 needs
#                        Gradle 9.6.0 and JDK 17, defaults to NDK 28.2.13676358, supports API 37)
#   targetSdk            developer.android.com/google/play/requirements/target-sdk (API 36)
#   ndk >= r28           developer.android.com/guide/practices/page-sizes (16 KB by default)
#   jna >= 5.12.0, coroutines >= 1.6   UniFFI user guide, Kotlin / Gradle page
# The exact jna, coroutines, firebase and androidx.test patch versions below were not
# re-checked against their release pages on that date.

[versions]
agp = "9.5.1"
compileSdk = "36"
targetSdk = "36"
# OPEN-VALUE: the design names no minimum. 28 is the first level with StrongBox
# (`setIsStrongBoxBacked`), which the Keystore rule of the design calls unconditionally.
minSdk = "28"
ndk = "28.2.13676358"
jna = "5.17.0"
coroutines = "1.10.2"
firebaseMessaging = "25.0.0"
junit = "4.13.2"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
