org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ABIs packaged into the AAR, as cargo-ndk names them. The design's release matrix is the
# three below; arm64-v8a and x86_64 are the minimum for a device and an emulator.
ramflux.abis=arm64-v8a,armeabi-v7a,x86_64
# Cargo profile of the native build: release for the AAR, dev for a quick emulator loop.
ramflux.cargoProfile=release
# Cargo features of ramflux-ffi. Production: embedded. Emulator fixture (never shipped):
#   -Pramflux.ffiFeatures=embedded,ramflux-sdk/itest-memory-vault -Pramflux.itestBuild=1
#   -Pramflux.cargoProfile=dev
ramflux.ffiFeatures=embedded
ramflux.itestBuild=0
