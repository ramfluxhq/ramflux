[package]
name = "ramflux-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license.workspace = true
repository = "https://github.com/ramfluxhq/ramflux"
publish = false
description = "Browser host for a linked secondary ramflux device (wasm32-unknown-unknown)."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Marker features that a browser build must never carry. Each one is a compile error on
# `target_family = "wasm"` (see `src/role.rs`); they exist so that a workspace-wide
# `--all-features` build of the wasm target fails loudly instead of silently linking
# primary-authority code.
primary-authority = []
account-recovery = []
# S-STORE probe: link the shared storage crate (rusqlite with bundled SQLCipher, which resolves
# to sqlite-wasm-rs on this target). Off until the spike passes; see `store_policy::StoreEngine`.
opfs-sqlcipher = ["dep:ramflux-storage", "dep:rusqlite"]

[dependencies]
ramflux-protocol = { workspace = true }
ramflux-crypto = { workspace = true }
ramflux-storage = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { workspace = true }
thiserror = "2.0"
x25519-dalek = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Randomness seam: every getrandom major in the dependency tree needs its browser backend.
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# S-STORE probe only: on this target rusqlite's `bundled-sqlcipher` builds through sqlite-wasm-rs,
# which needs this rusqlite feature (the storage crate disables rusqlite's default features).
rusqlite = { workspace = true, optional = true, features = ["ffi-sqlite-wasm-rs"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "deny"
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
