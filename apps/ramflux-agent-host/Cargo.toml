[package]
name = "ramflux-agent-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
itest-memory-vault = ["ramflux-sdk/itest-memory-vault"]

[dependencies]
ramflux-sdk.workspace = true
ramflux-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap.workspace = true
keyring.workspace = true
libc = "0.2"
rustix = { version = "1.1", features = ["process"] }
zeroize.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }

[lints]
workspace = true

[dev-dependencies]
bytes.workspace = true
http-body-util = "0.1"
hyper.workspace = true
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
tempfile = "3"
tokio = { workspace = true, features = ["net", "sync"] }
