[package]
name = "ramflux-rf"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license.workspace = true
repository = "https://github.com/ramflux/ramflux-rf"

[[bin]]
name = "rf"
path = "src/main.rs"

[features]
default = []
# Process-local credential vault for native integration fixtures only.
itest-memory-vault = ["ramflux-sdk/itest-memory-vault"]
# Explicit legacy fixture creation; never enabled by production builds.
itest-legacy-accounts = ["ramflux-sdk/itest-legacy-accounts"]
# Default-off short registration-proof lifetime for integration tests only.
itest-identity-proof = ["ramflux-sdk/itest-identity-proof"]
# T24-B2: propagate the SDK rfd mid-flight crash-resume barrier gate. Never enabled by production rf.
itest-rfd-fault = ["ramflux-sdk/itest-rfd-fault"]
# T25-A2 (OBJ-IPC-01): propagate the SDK local-bus response-loss seam gate. Never enabled by
# production rf.
itest-bus-fault = ["ramflux-sdk/itest-bus-fault"]
# T25-A5 (OBJ-IPC-01): propagate the SDK object-IPC crash-abort seam gate. Never enabled by
# production rf.
object-ipc-crash-seam = ["ramflux-sdk/object-ipc-crash-seam"]

[dependencies]
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-protocol = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-crypto = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-sdk = { workspace = true }
# path dep for local dev; switch to git tag dep when GitHub repos exist
ramflux-sync = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { workspace = true }
keyring = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.42", features = ["macros", "rt", "rt-multi-thread"] }
zeroize = "1.8"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
ramflux-test-support.workspace = true
tempfile.workspace = true
tokio = { version = "1.42", features = ["test-util"] }
tracing = { workspace = true }
ramflux-node-core = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust", "vendored"] }
