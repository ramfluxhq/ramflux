[package]
name = "ramflux-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.ramflux]
commercial-license = true

[features]
default = []
compio-gateway = ["dep:compio", "ramflux-transport/compio-gateway"]
itest-http = ["ramflux-node-core/itest-http"]
[dependencies]
anyhow = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
quinn = { workspace = true }
ramflux-crypto = { workspace = true }
ramflux-node-core = { workspace = true }
ramflux-protocol = { workspace = true }
ramflux-transport = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { version = "=0.19.2", features = ["time"], optional = true }

[lints]
workspace = true

[dev-dependencies]
ramflux-test-support.workspace = true
tempfile.workspace = true
ramflux-storage = { workspace = true }
tokio = { workspace = true, features = ["test-util", "process"] }
ramflux-node-core = { workspace = true, features = ["durability-test-hooks", "test-support"] }
ramflux-sdk = { workspace = true, features = ["test-support"] }
rcgen = { workspace = true }
redb = { workspace = true }
ramflux-transport = { workspace = true, features = ["test-support"] }
rustls-pemfile = { workspace = true }
