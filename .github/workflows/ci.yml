name: CI

on:
  # Feature branches run through their pull request only; a push trigger on every branch would
  # start a second identical run per push.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# One group per ref: a newer push to a feature branch cancels the older run.
# Main runs get a per-commit group so they are never cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: SPDX headers and crate licenses
        run: ./scripts/check-license-headers.sh

      - name: Root-qualified device identity structure
        run: |
          python3 -B scripts/test_device_identity.py
          python3 -B scripts/check-device-identity.py

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: checks

      - name: Install cargo-machete
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-machete@0.9.2

      - name: Production feature provenance
        run: python3 -B scripts/check-production-features.py

      - name: Managed account transactions
        run: |
          python3 -B scripts/test_account_transactions.py
          python3 -B scripts/check-account-transactions.py

      - name: Format
        run: cargo fmt --check --all

      - name: Cargo machete
        # Unused-dependency detection is advisory: cargo-machete has known false
        # positives on workspace-inherited deps, so a finding reports but must
        # not block CI. Real unused deps are pruned in the manifests directly.
        continue-on-error: true
        run: cargo machete

  clippy-itest:
    name: Clippy (itest, all features)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: clippy-itest

      - name: Clippy
        run: RAMFLUX_ITEST_BUILD=1 cargo clippy --workspace --all-targets --all-features -- -D warnings

  clippy-default:
    name: Clippy (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: clippy-default

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: doctests

      - name: Doctests
        run: cargo test --workspace --doc

  build-sdk:
    name: Build test archive (sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: arch-sdk

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Archive
        run: cargo nextest archive -p ramflux-sdk --archive-file sdk.tar.zst

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-sdk
          path: sdk.tar.zst
          retention-days: 1
          compression-level: 0

  build-rest:
    name: Build test archive (rest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: arch-rest

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Archive
        run: cargo nextest archive --workspace --exclude ramflux-sdk --archive-file rest.tar.zst

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-rest
          path: rest.tar.zst
          retention-days: 1
          compression-level: 0

  # The C ABI smoke test (crates/ramflux-sdk/tests/c_abi_smoke.rs) is excluded from PR CI below:
  # it runs a nested cargo build, and nothing consumes the C ABI while mobile is frozen. It runs
  # again when mobile/ABI integration starts. The all-features clippy job still compiles c_abi.
  test-sdk:
    name: Tests (sdk ${{ matrix.shard }}/6)
    needs: build-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Use tmpfs for /tmp
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: archive-sdk
      - name: Run shard
        run: cargo nextest run --archive-file sdk.tar.zst --workspace-remap . --extract-to . --extract-overwrite --profile ci -E 'not binary(c_abi_smoke)' --partition hash:${{ matrix.shard }}/6

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-sdk-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  test-rest:
    name: Tests (rest ${{ matrix.shard }}/2)
    needs: build-rest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Use tmpfs for /tmp
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: archive-rest
      - name: Run shard
        run: cargo nextest run --archive-file rest.tar.zst --workspace-remap . --extract-to . --extract-overwrite --profile ci --partition hash:${{ matrix.shard }}/2

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-rest-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  v-memory-vault:
    name: "SDK variant: memory vault (custody + approve_once)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Use tmpfs for /tmp
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: v-memory-vault

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Test
        run: RAMFLUX_ITEST_BUILD=1 cargo nextest run --profile ci --no-tests=fail -p ramflux-sdk --features itest-memory-vault -E 'test(custody) | test(approve_once_requires_daemon_opt_in_and_refuses_every_second_arm_with_a_typed_error)'

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-v-memory-vault
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore


  v-production:
    name: "SDK variant: migration fixture absent from production"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Use tmpfs for /tmp
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: v-production

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Test
        run: RAMFLUX_PRODUCTION_BUILD=1 cargo nextest run --profile ci --no-tests=fail -p ramflux-sdk --lib -E 'test(itest_migration_approve_once_method_is_absent_from_a_production_build)'

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-v-production
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore


  v-legacy:
    name: "SDK variant: legacy accounts fixture"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Use tmpfs for /tmp
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: v-legacy

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Test
        run: RAMFLUX_ITEST_BUILD=1 cargo nextest run --profile ci --no-tests=fail -p ramflux-sdk --features itest-legacy-accounts -E 'test(itest_legacy)'

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-v-legacy
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore


  v-local-mint:
    name: Gateway local-mint regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Use tmpfs for /tmp
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: v-local-mint

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Test
        run: cargo nextest run --profile ci --no-tests=fail -p ramflux-gateway --features itest-local-mint

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-v-local-mint
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore


  mutants:
    name: Mutants (advisory, diff only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust diff
        id: diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- '*.rs' > pr.diff
          if [ -s pr.diff ]; then echo "has=true" >> "$GITHUB_OUTPUT"; fi

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: mutants

      - name: Install nextest and cargo-mutants
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150,cargo-mutants@27.1.0

      - name: cargo mutants --in-diff
        if: steps.diff.outputs.has == 'true'
        run: |
          # The shards already ran the baseline suite, so it is skipped here. A failure stays
          # visible as a failed (advisory) job; only the 8 minute time box itself is tolerated.
          rc=0
          timeout 480 cargo mutants --in-diff pr.diff --test-tool nextest --baseline=skip --timeout 120 --no-shuffle || rc=$?
          if [ "$rc" -eq 124 ]; then echo "time box reached"; exit 0; fi
          exit "$rc"

      - name: Upload mutants report
        if: always() && steps.diff.outputs.has == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore

  test-graceful-shutdown:
    name: Configured graceful shutdown (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: graceful-shutdown

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Migration release gate regressions
        run: RAMFLUX_ITEST_BUILD=1 cargo nextest run --profile ci --no-tests=fail -p ramflux-router --features itest-http -E 'test(legacy_home_node_apply_routes_are_absent_on_http_and_mesh_admin) | test(forwarded_endpoint_is_not_reachable_from_client_listener)'

      - name: Configured graceful shutdown regressions
        timeout-minutes: 13
        run: RAMFLUX_ITEST_BUILD=1 cargo nextest run --profile shutdown --no-tests=fail -p ramflux-router -p ramflux-retention -p ramflux-federation -p ramflux-gateway -p ramflux-notify -p ramflux-relay --features itest-http,ramflux-notify/compio-notify --test graceful_shutdown

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-graceful-shutdown
          path: target/nextest/shutdown/junit.xml
          if-no-files-found: ignore

  quic-dependencies:
    name: Patched QUIC dependency tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
      - name: Verify patches and unique resolution
        run: python3 -B scripts/check-quic-patches.py
      - name: Run dependency libraries explicitly
        run: python3 -B scripts/test-quic-dependencies.py
