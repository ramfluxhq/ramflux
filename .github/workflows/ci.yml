name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One group per ref: a newer push to a feature branch cancels the older run.
# Main runs get a per-commit group so they are never cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: SPDX headers and crate licenses
        run: ./scripts/check-license-headers.sh

      - name: Root-qualified device identity structure
        run: |
          python3 -B scripts/test_device_identity.py
          python3 -B scripts/check-device-identity.py

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Production feature provenance
        run: python3 -B scripts/check-production-features.py

      - name: Format
        run: cargo fmt --check --all

      - name: Clippy
        run: RAMFLUX_ITEST_BUILD=1 cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo machete
        # Unused-dependency detection is advisory: cargo-machete has known false
        # positives on workspace-inherited deps, so a finding reports but must
        # not block CI. Real unused deps are pruned in the manifests directly.
        continue-on-error: true
        run: cargo machete

      - name: Gateway local-mint regression tests
        run: cargo test -p ramflux-gateway --features itest-local-mint

  test-sdk:
    name: Rust tests (SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb

      - name: Test SDK
        run: cargo test -p ramflux-sdk

      - name: Born-v3 memory vault regression tests
        run: RAMFLUX_ITEST_BUILD=1 cargo test -p ramflux-sdk --features itest-memory-vault custody

      - name: Legacy fixture regression tests
        run: RAMFLUX_ITEST_BUILD=1 cargo test -p ramflux-sdk --features itest-legacy-accounts itest_legacy

  test-rest:
    name: Rust tests (workspace except SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb

      - name: Test workspace except SDK
        run: cargo test --workspace --exclude ramflux-sdk
