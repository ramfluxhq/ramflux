        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Test (legacy accounts)
        run: |
          RAMFLUX_ITEST_BUILD=1 cargo nextest run --no-run --profile ci --no-tests=fail -p ramflux-sdk --features itest-legacy-accounts -E 'test(itest_legacy)'
          RAMFLUX_ITEST_BUILD=1 python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label legacy-accounts -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-sdk --features itest-legacy-accounts -E 'test(itest_legacy)'

      - name: Build same-tree router for the session push real-router gate
        if: ${{ !cancelled() }}
        run: |
          cargo build -p ramflux-router --bin ramflux-router
          router="$GITHUB_WORKSPACE/target/debug/ramflux-router"
          test -x "$router"
          echo "RAMFLUX_P17_ROUTER_BINARY=$router" >> "$GITHUB_ENV"

      - name: Session push real-router gate (explicit, ignored by default)
        if: ${{ !cancelled() }}
        run: |
          python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label session-push-real-router -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-gateway --features itest-local-mint --run-ignored only -E 'test(session_push_capability_negotiation_real_router)'

      - name: Ephemeral activation and persistence (real router, WAL on)
        if: ${{ !cancelled() }}
        env:
          RAMFLUX_ROUTER_WAL: "1"
          RAMFLUX_ROUTER_ASYNC_POOL_SIZE: "1"
        run: |
          python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label ephemeral-wal1 -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-gateway --features itest-local-mint --run-ignored only -E 'test(activation::)'

      - name: Ephemeral persistence (real router, WAL off)
        if: ${{ !cancelled() }}
        env:
          RAMFLUX_ROUTER_WAL: "0"
          RAMFLUX_ROUTER_ASYNC_POOL_SIZE: "1"
        run: |
          python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label ephemeral-wal0 -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-gateway --features itest-local-mint --run-ignored only -E 'test(ephemeral_persistence_absence)'
      - name: Preauth transport matrices (Quinn, TCP TLS, Linux compio)
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --no-run --profile ci --no-tests=fail -p ramflux-gateway --features compio-gateway,itest-local-mint --run-ignored only -E 'test(preauth_claim_rotation_transport_matrix) | test(preauth_signed_open_transport_matrix) | test(gateway_transport_auth_does_not_snapshot_state) | test(competing_signed_writes_preserve_network_progress_and_bounded_pending) | test(saturated_writer_voice_renew_preserves_active_call_and_initial_media) | test(generation_zero_refuses_new_classes_through_gateway_router)'
          python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label preauth-transport -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-gateway --features compio-gateway,itest-local-mint --run-ignored only -E 'test(preauth_claim_rotation_transport_matrix) | test(preauth_signed_open_transport_matrix) | test(gateway_transport_auth_does_not_snapshot_state) | test(competing_signed_writes_preserve_network_progress_and_bounded_pending) | test(saturated_writer_voice_renew_preserves_active_call_and_initial_media) | test(generation_zero_refuses_new_classes_through_gateway_router)'


      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-v-sdk-b
          path: target/nextest/ci/junit-*.xml
          if-no-files-found: ignore
      - name: Reject leaked test temporary files
        if: always() && env.RF_TEST_TMPDIR != ''
        run: python3 -B scripts/ci/test-tmp.py check

  mutants:
    name: Mutants (advisory, diff only)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate test temporary files
        run: python3 -B scripts/ci/test-tmp.py init

      - name: Rust diff
        id: diff
        env:
          MUTANTS_BASE: ${{ github.event.pull_request.base.sha || inputs.mutants_base }}
        run: |
          echo "MUTANTS_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$MUTANTS_BASE" ]; then echo "::error::mutants_base is empty"; exit 1; fi
          if ! base=$(git rev-parse --verify --quiet --end-of-options "$MUTANTS_BASE^{commit}"); then
            echo "::error::mutants_base is not a commit: $MUTANTS_BASE"; exit 1
          fi
          git diff --no-ext-diff --no-textconv "$base...HEAD" -- '*.rs' ':(exclude)vendor/**' > pr.diff
          if [ -s pr.diff ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install pinned Rust toolchain and check build prerequisites
        if: steps.diff.outputs.has == 'true'
        timeout-minutes: 2
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        if: steps.diff.outputs.has == 'true'
        timeout-minutes: 2
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: mutants

      - name: Install nextest and cargo-mutants
        if: steps.diff.outputs.has == 'true'
        timeout-minutes: 2
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150,cargo-mutants@27.1.0

      - name: cargo mutants --in-diff
        id: mutation
        if: steps.diff.outputs.has == 'true'
        continue-on-error: true
        run: |
          # Reserve two minutes of the job for summary/artifact publication.
          budget=$((480 - $(date +%s) + MUTANTS_STARTED_AT))
          rc=124
          if [ "$budget" -gt 0 ]; then
            rc=0
            timeout --kill-after=10s "$budget" cargo mutants --in-diff pr.diff --test-tool nextest --baseline=skip --timeout 120 --no-shuffle || rc=$?
          fi
          echo "status=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Summarize mutants
        if: always()
        env:
          MUTATION_STATUS: ${{ steps.mutation.outputs.status || 'not-run' }}
          MUTATION_DIFF: ${{ steps.diff.outputs.has || 'unknown' }}
        run: python3 -B scripts/ci/report-mutants.py --status "$MUTATION_STATUS" --has-diff "$MUTATION_DIFF" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants report
        if: always() && steps.diff.outputs.has == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
      - name: Reject leaked test temporary files
        if: always() && env.RF_TEST_TMPDIR != ''
        run: python3 -B scripts/ci/test-tmp.py check

  test-graceful-shutdown:
    name: Configured graceful shutdown (Linux)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Isolate test temporary files
        run: python3 -B scripts/ci/test-tmp.py init

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: graceful-shutdown

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Migration release gate regressions
        run: |
          RAMFLUX_ITEST_BUILD=1 cargo nextest run --no-run --profile ci --no-tests=fail -p ramflux-router --features itest-http -E 'test(legacy_home_node_apply_routes_are_absent_on_http_and_mesh_admin) | test(forwarded_endpoint_is_not_reachable_from_client_listener)'
          RAMFLUX_ITEST_BUILD=1 python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label migration-refusals -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-router --features itest-http -E 'test(legacy_home_node_apply_routes_are_absent_on_http_and_mesh_admin) | test(forwarded_endpoint_is_not_reachable_from_client_listener)'

      - name: Configured graceful shutdown regressions
        timeout-minutes: 13
        run: |
          RAMFLUX_ITEST_BUILD=1 cargo nextest run --no-run --profile shutdown --no-tests=fail -p ramflux-router -p ramflux-retention -p ramflux-federation -p ramflux-gateway -p ramflux-notify -p ramflux-relay --features itest-http,ramflux-notify/compio-notify --test graceful_shutdown
          RAMFLUX_ITEST_BUILD=1 python3 -B scripts/ci/run-nextest.py --junit target/nextest/shutdown/junit.xml --label graceful-shutdown -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile shutdown --no-tests=fail -p ramflux-router -p ramflux-retention -p ramflux-federation -p ramflux-gateway -p ramflux-notify -p ramflux-relay --features itest-http,ramflux-notify/compio-notify --test graceful_shutdown

      - name: Gateway management route regressions
        run: |
          RAMFLUX_ITEST_BUILD=1 cargo nextest run --no-run --profile ci --no-tests=fail -p ramflux-gateway --features itest-http --bin ramflux-gateway -E 'test(itest_http::tests)'
          RAMFLUX_ITEST_BUILD=1 python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label gateway-management -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-gateway --features itest-http --bin ramflux-gateway -E 'test(itest_http::tests)'
          RAMFLUX_ITEST_BUILD=1 cargo nextest run --no-run --profile ci --no-tests=fail -p ramflux-gateway --features itest-http --bin ramflux-gateway -E 'test(durable_work::tests)'
          RAMFLUX_ITEST_BUILD=1 python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label gateway-durable-fairness -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-gateway --features itest-http --bin ramflux-gateway -E 'test(durable_work::tests)'

      - name: Gateway startup cancellation regressions
        run: |
          RAMFLUX_ITEST_BUILD=1 cargo nextest run --no-run --profile ci --no-tests=fail -p ramflux-gateway --all-features --test startup_cancellation
          RAMFLUX_ITEST_BUILD=1 python3 -B scripts/ci/run-nextest.py --junit target/nextest/ci/junit.xml --label gateway-startup-cancellation -- ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-gateway --all-features --test startup_cancellation

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-graceful-shutdown
          path: |
            target/nextest/shutdown/junit-*.xml
            target/nextest/ci/junit-migration-refusals.xml
            target/nextest/ci/junit-gateway-startup-cancellation.xml
            target/nextest/ci/junit-gateway-management.xml
            target/nextest/ci/junit-gateway-durable-fairness.xml
          if-no-files-found: ignore
      - name: Reject leaked test temporary files
        if: always() && env.RF_TEST_TMPDIR != ''
        run: python3 -B scripts/ci/test-tmp.py check

  quic-dependencies:
    name: Patched QUIC dependency tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Isolate test temporary files
        run: python3 -B scripts/ci/test-tmp.py init
      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
      - name: Verify patches and unique resolution
        run: python3 -B scripts/check-quic-patches.py --verify-upstream
      - name: Run dependency libraries explicitly
        run: python3 -B scripts/test-quic-dependencies.py
      - name: Reject leaked test temporary files
        if: always() && env.RF_TEST_TMPDIR != ''
        run: python3 -B scripts/ci/test-tmp.py check
