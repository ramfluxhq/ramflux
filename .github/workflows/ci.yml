  mutants:
    name: Mutants (advisory, diff only)
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Rust diff
        id: diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- '*.rs' ':(exclude)vendor/**' > pr.diff
          if [ -s pr.diff ]; then echo "has=true" >> "$GITHUB_OUTPUT"; fi

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: mutants

      - name: Install nextest and cargo-mutants
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150,cargo-mutants@27.1.0

      - name: cargo mutants --in-diff
        if: steps.diff.outputs.has == 'true'
        run: |
          # The shards already ran the baseline suite, so it is skipped here. A failure stays
          # visible as a failed (advisory) job; only the 8 minute time box itself is tolerated.
          if [ "${{ runner.environment }}" != github-hosted ]; then
            test_host="$(rustc -vV | sed -n 's/^host: //p')"
            runner_key="CARGO_TARGET_$(printf '%s' "$test_host" | tr '[:lower:]-' '[:upper:]_')_RUNNER"
            export "$runner_key=bash $GITHUB_WORKSPACE/scripts/ci/private-netns.sh"
          fi
          rc=0
          timeout 480 cargo mutants --in-diff pr.diff --test-tool nextest --baseline=skip --timeout 120 --no-shuffle || rc=$?
          if [ "$rc" -eq 124 ]; then echo "time box reached"; exit 0; fi
          exit "$rc"

      - name: Upload mutants report
        if: always() && steps.diff.outputs.has == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore

