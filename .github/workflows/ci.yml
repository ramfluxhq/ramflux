name: CI

on:
  # Feature branches run through their pull request only; a push trigger on every branch would
  # start a second identical run per push.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      mutants_base:
        description: "Git base the advisory mutants run diffs against (mutants job only)"
        required: true
        default: "origin/main~20"
        type: string

# One group per ref: a newer run on the same ref (feature branch or main) cancels the older one,
# so superseded main runs stop queueing for runner slots. Only the newest main commit is verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: SPDX headers and crate licenses
        run: ./scripts/check-license-headers.sh

      - name: Root-qualified device identity structure
        run: |
          python3 -B scripts/test_device_identity.py
          python3 -B scripts/check-device-identity.py

      - name: Independent pairing codec vectors
        run: python3 -B scripts/check-pairing-oracle.py --check

      - name: Envelope TTL inventory
        run: python3 -B scripts/check-content-ttl.py

      - name: Production feature guard self-tests
        run: python3 -B scripts/test_production_features.py

      - name: CI verification tooling self-tests
        run: |
          python3 -B scripts/ci/report-flakes.py --self-test
          python3 -B scripts/ci/report-mutants.py --self-test
          python3 -B scripts/ci/run-nextest.py --self-test
          python3 -B scripts/ci/test-tmp.py self-test
          python3 -B scripts/ci/run-libtest.py --self-test
          python3 -B scripts/ci/test-timing.py --self-test

  test-timing:
    name: Test timing guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Reject new or expired test timing sites
        run: python3 -B scripts/ci/test-timing.py --check

  compose-preflight:
    name: Compose input preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Podman Compose renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/compose-preflight"
          "$RUNNER_TEMP/compose-preflight/bin/python" -m pip install --disable-pip-version-check 'podman-compose==1.3.0'

      - name: Config-only preflight regressions
        env:
          DEMO_TEST_PODMAN_COMPOSE: ${{ runner.temp }}/compose-preflight/bin/podman-compose
          COMPOSE_TEST_DOCKER_COMPOSE: docker compose
        # These tests render config only; no containers are started.
        run: |
          "$DEMO_TEST_PODMAN_COMPOSE" --version
          docker compose version
          "$RUNNER_TEMP/compose-preflight/bin/python" -B -m unittest discover \
            -s deploy/scripts/tests -p test_compose_preflight.py -v

      - name: Demo advertised origin and ownership regressions
        run: |
          python3 -B -m unittest discover -s deploy/scripts/tests -p test_demo_public_origin.py -v
          python3 -B -m unittest discover -s deploy/scripts/tests -p test_demo_node_config.py -v

  # Only main pushes and same-repository PRs use the sandboxed pool.
  # Dependabot, forks, manual runs and RF_CI_RUNNER=github use GitHub-hosted runners.
  # Set repository variable RF_CI_RUNNER=github to force the hosted fallback.
  # Pool jobs have no secrets and require the host's native build dependencies.
  rust:
    name: Rust checks
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: checks

      - name: Install cargo-machete
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-machete@0.9.2

      - name: Production feature provenance
        run: python3 -B scripts/check-production-features.py

      - name: Managed account transactions
        run: |
          python3 -B scripts/test_account_transactions.py
          python3 -B scripts/check-account-transactions.py

      - name: Format
        run: cargo fmt --check --all

      - name: Cargo machete
        # Unused-dependency detection is advisory: cargo-machete has known false
        # positives on workspace-inherited deps, so a finding reports but must
        # not block CI. Real unused deps are pruned in the manifests directly.
        continue-on-error: true
        run: cargo machete

  clippy-itest:
    name: Clippy (itest, all features)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: clippy-itest

      - name: Clippy
        run: RAMFLUX_ITEST_BUILD=1 cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Generated C ABI header matches reviewed bytes
        run: python3 -B scripts/check-c-abi-header.py

  clippy-default:
    name: Clippy (default features)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: clippy-default

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  card-runtime:
    name: Card runtime (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            timeout: 15
          - os: macos-latest
            target: aarch64-apple-darwin
            timeout: 30
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            timeout: 30
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Isolate test temporary files
        run: python -B scripts/ci/test-tmp.py init
      - name: Install pinned Rust toolchain
        run: |
          toolchain="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --target ${{ matrix.target }}
      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: card-runtime
      - name: Build C ABI and release compiler
        run: cargo build --locked -p ramflux-card --all-features --target ${{ matrix.target }}
      - name: Check all card features and release compiler
        run: cargo clippy --locked -p ramflux-card --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: Test C ABI, runtime and release packer
        run: cargo test --locked -p ramflux-card --all-features --target ${{ matrix.target }} -- --test-threads=1
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.2'
          cache: npm
          cache-dependency-path: crates/ramflux-card/library/package-lock.json
      - name: Check component types, capability lint and bundled bytes
        working-directory: crates/ramflux-card/library
        run: |
          npm ci --ignore-scripts
          npm test
          npm run typecheck
          npm run typecheck:web
          npm run check
      - name: Check shared WASM worker core
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          CC_wasm32_unknown_unknown=clang cargo clippy --locked -p ramflux-card --all-features --lib --target wasm32-unknown-unknown -- -D warnings
          CC_wasm32_unknown_unknown=clang cargo build --locked -p ramflux-card --features web --lib --target wasm32-unknown-unknown
      - name: Build pinned web host and reject bundle drift
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install --locked wasm-bindgen-cli --version 0.2.126
          python3 -c 'import json,pathlib; p=pathlib.Path("target/card-web"); p.mkdir(parents=True,exist_ok=True); (p/"seed").write_bytes(bytes([7])*32); (p/"release.json").write_text(json.dumps(dict(app_id="org.ramflux.card",package_id="org.ramflux.card.library",security_epoch=1,version=1))); (p/"policy.json").write_text(json.dumps(dict(app_id="org.ramflux.card",package_id="org.ramflux.card.library",minimum_epoch=1,minimum_version=1,exact_descriptor_sha256=None)))'
          cargo run --locked -p ramflux-card --features compiler --bin card-pack -- crates/ramflux-card/library/form.js target/card-web/seed target/card-web/release.json target/card-web/cards
          wasm-bindgen target/wasm32-unknown-unknown/debug/ramflux_card.wasm --target web --out-dir crates/ramflux-card/web/pkg
          node crates/ramflux-card/web/build-web.mjs target/card-web/cards target/card-web/policy.json
          node crates/ramflux-card/web/build-web.mjs --check target/card-web/cards target/card-web/policy.json
      - name: Reject leaked test temporary files
        if: always() && env.RF_TEST_TMPDIR != ''
        run: python -B scripts/ci/test-tmp.py check

  doctests:
    name: Doctests
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Isolate test temporary files
        run: python3 -B scripts/ci/test-tmp.py init

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: doctests

      - name: Doctests
        run: |
          cargo build --workspace
          cargo fetch --locked
          CARGO_NET_OFFLINE=true ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo test --workspace --doc
      - name: Reject leaked test temporary files
        if: always() && env.RF_TEST_TMPDIR != ''
        run: python3 -B scripts/ci/test-tmp.py check

  build-sdk:
    name: Build test archive (sdk)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: arch-sdk

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Archive
        run: cargo nextest archive -p ramflux-sdk --features durability-test-hooks --archive-file sdk.tar.zst

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-sdk
          path: sdk.tar.zst
          retention-days: 1
          compression-level: 0

  build-rest:
    name: Build test archive (rest)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: arch-rest

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Archive
        run: cargo nextest archive --workspace --exclude ramflux-sdk --archive-file rest.tar.zst

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-rest
          path: rest.tar.zst
          retention-days: 1
          compression-level: 0

  # GitHub-hosted CLI jobs. itest-memory-vault is compile-gated and used only for fixtures;
  # production rf default features stay empty. Not a local lane gate.
  cli-e2e:
    name: CLI e2e (rf, GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Isolate test temporary files
        run: python3 -B scripts/ci/test-tmp.py init

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git openssl; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: cli-e2e

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Build node binaries and run rf CLI e2e
        env:
          RAMFLUX_ITEST_BUILD: "1"
        run: |
          cargo build -p ramflux-federation -p ramflux-router -p ramflux-retention -p ramflux-gateway
          python3 -B scripts/ci/run-nextest.py --label e2e_harness -- cargo nextest run --profile ci --no-tests=fail -p ramflux-rf --test e2e_harness --test-threads=1
          # Includes b1_same_node_bidirectional_dm_uses_deliver_without_resume and
          # two_nodes_have_separate_identities_cas_and_stores (Demo B).
          python3 -B scripts/ci/run-nextest.py --label e2e_boot_dm -- cargo nextest run --profile ci --no-tests=fail -p ramflux-rf --features itest-memory-vault --test e2e_boot_dm --run-ignored ignored-only --test-threads=1
          # Keep f2 here; the b7_* matrix runs in parallel below.
          python3 -B scripts/ci/run-nextest.py --label e2e_resume -- cargo nextest run --profile ci --no-tests=fail -p ramflux-rf --features itest-memory-vault --test e2e_resume --run-ignored ignored-only --test-threads=1 -E 'not test(b7_)'
          python3 -B scripts/ci/run-nextest.py --label e2e_push_restart -- cargo nextest run --profile ci --no-tests=fail -p ramflux-rf --features itest-memory-vault --test e2e_push_restart --run-ignored ignored-only --test-threads=1
          python3 -B scripts/ci/run-nextest.py --label e2e_group -- cargo nextest run --profile ci --no-tests=fail -p ramflux-rf --features itest-memory-vault --test e2e_group --run-ignored ignored-only --test-threads=1
          # Unified rows explicitly report dormancy until the separately audited activation.
          cargo build -p ramflux-rf --bin rf --features itest-memory-vault,itest-rfd-fault
          python3 -B scripts/ci/run-nextest.py --label e2e_unified_gate -- cargo nextest run --profile ci --no-tests=fail -p ramflux-rf --features itest-memory-vault,itest-rfd-fault --test e2e_unified_gate --run-ignored ignored-only --test-threads=1

      - name: Upload CLI JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-cli
          path: target/nextest/ci/junit-*.xml
          if-no-files-found: ignore

      - name: Reject leaked test temporary files
        if: always() && env.RF_TEST_TMPDIR != ''
        run: python3 -B scripts/ci/test-tmp.py check

  # Independent hosted runner: B7 never consumes the smoke job budget.
  cli-e2e-b7:
    name: CLI e2e (Demo B B7, GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Isolate test temporary files
