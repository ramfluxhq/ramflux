name: CI

on:
  # Feature branches run through their pull request only; a push trigger on every branch would
  # start a second identical run per push.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      mutants_base:
        description: "Git base the advisory mutants run diffs against (mutants job only)"
        required: true
        default: "origin/main~20"
        type: string

# One group per ref: a newer run on the same ref (feature branch or main) cancels the older one,
# so superseded main runs stop queueing for runner slots. Only the newest main commit is verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: SPDX headers and crate licenses
        run: ./scripts/check-license-headers.sh

      - name: Root-qualified device identity structure
        run: |
          python3 -B scripts/test_device_identity.py
          python3 -B scripts/check-device-identity.py

      - name: Independent pairing codec vectors
        run: python3 -B scripts/check-pairing-oracle.py --check

  compose-preflight:
    name: Compose input preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Podman Compose renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/compose-preflight"
          "$RUNNER_TEMP/compose-preflight/bin/python" -m pip install --disable-pip-version-check 'podman-compose==1.3.0'

      - name: Config-only preflight regressions
        env:
          DEMO_TEST_PODMAN_COMPOSE: ${{ runner.temp }}/compose-preflight/bin/podman-compose
          COMPOSE_TEST_DOCKER_COMPOSE: docker compose
        # These tests render config only; no containers are started.
        run: |
          "$DEMO_TEST_PODMAN_COMPOSE" --version
          docker compose version
          "$RUNNER_TEMP/compose-preflight/bin/python" -B -m unittest discover \
            -s deploy/scripts/tests -p test_compose_preflight.py -v

  # Only main pushes and same-repository PRs use the sandboxed pool.
  # Dependabot, forks, manual runs and RF_CI_RUNNER=github use GitHub-hosted runners.
  # Set repository variable RF_CI_RUNNER=github to force the hosted fallback.
  # Pool jobs have no secrets and require the host's native build dependencies.
  rust:
    name: Rust checks
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: checks

      - name: Install cargo-machete
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-machete@0.9.2

      - name: Production feature provenance
        run: python3 -B scripts/check-production-features.py

      - name: Managed account transactions
        run: |
          python3 -B scripts/test_account_transactions.py
          python3 -B scripts/check-account-transactions.py

      - name: Format
        run: cargo fmt --check --all

      - name: Cargo machete
        # Unused-dependency detection is advisory: cargo-machete has known false
        # positives on workspace-inherited deps, so a finding reports but must
        # not block CI. Real unused deps are pruned in the manifests directly.
        continue-on-error: true
        run: cargo machete

  clippy-itest:
    name: Clippy (itest, all features)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: clippy-itest

      - name: Clippy
        run: RAMFLUX_ITEST_BUILD=1 cargo clippy --workspace --all-targets --all-features -- -D warnings

  clippy-default:
    name: Clippy (default features)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: clippy-default

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  doctests:
    name: Doctests
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: doctests

      - name: Doctests
        run: |
          cargo build --workspace
          cargo fetch --locked
          CARGO_NET_OFFLINE=true ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo test --workspace --doc

  build-sdk:
    name: Build test archive (sdk)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: arch-sdk

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Archive
        run: cargo nextest archive -p ramflux-sdk --features durability-test-hooks --archive-file sdk.tar.zst

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-sdk
          path: sdk.tar.zst
          retention-days: 1
          compression-level: 0

  build-rest:
    name: Build test archive (rest)
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: arch-rest

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Archive
        run: cargo nextest archive --workspace --exclude ramflux-sdk --archive-file rest.tar.zst

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-rest
          path: rest.tar.zst
          retention-days: 1
          compression-level: 0

  linux-vault-platform:
    name: Linux vault platform fixture
    needs: [build-rest, build-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false
      - name: Install platform fixture tools
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd dbus dbus-x11 gnome-keyring libsecret-tools libsecret-1-dev zstd acl strace
      - name: Install nextest
        timeout-minutes: 10
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150
      - name: Download default-feature rest archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        timeout-minutes: 5
        with:
          name: archive-rest
      - name: Download default-feature SDK archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        timeout-minutes: 5
        with:
          name: archive-sdk
      - name: Verify pinned independent libsodium C oracle
        timeout-minutes: 5
        run: python3 -B scripts/linux-vault-vectors.py --check --oracle-dir "$RUNNER_TEMP/linux-vault-oracle"
      - name: Private user, D-Bus and actual systemd credential smoke
        timeout-minutes: 15
        run: sudo --preserve-env=PATH bash scripts/linux-vault-ci.sh rest.tar.zst
      - name: Real systemd init crash and owned-pipe cleanup proofs
        timeout-minutes: 8
        run: |
          NEXTEST=$(command -v cargo-nextest)
          sudo --preserve-env=PATH "$NEXTEST" nextest run --archive-file sdk.tar.zst --workspace-remap . --extract-to . --extract-overwrite --run-ignored ignored-only --no-tests=fail -E 'test(custody::vault::linux::init::tests::linux_vault_)'


      - name: Real local Secret Service initialization and cleanup proofs
        timeout-minutes: 8
        run: |
          NEXTEST=$(command -v cargo-nextest)
          sudo --preserve-env=PATH "$NEXTEST" nextest list --archive-file rest.tar.zst --workspace-remap . --extract-to . --extract-overwrite > /dev/null
          sudo --preserve-env=PATH "$NEXTEST" nextest list --archive-file sdk.tar.zst --workspace-remap . --extract-to . --extract-overwrite > /dev/null
          mapfile -t sdk < <(find target/debug/deps -maxdepth 1 -type f -name 'ramflux_sdk-*' -executable)
          mapfile -t platform < <(find target/debug/deps -maxdepth 1 -type f -name 'linux_vault_platform-*' -executable)
          test "${#sdk[@]}" -eq 1
          test "${#platform[@]}" -eq 1
          sudo bash scripts/linux-vault-secret-service-ci.sh "${sdk[0]}" "${platform[0]}" target/debug/rf


  # The C ABI smoke test (crates/ramflux-sdk/tests/c_abi_smoke.rs) is excluded from PR CI below:
  # it runs a nested cargo build, and nothing consumes the C ABI while mobile is frozen. It runs
  # again when mobile/ABI integration starts. The all-features clippy job still compiles c_abi.
  test-sdk:
    name: Tests (sdk ${{ matrix.shard }}/2)
    needs: build-sdk
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Use tmpfs for /tmp
        if: runner.environment == 'github-hosted'
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Create private test temp directory
        if: runner.environment == 'self-hosted'
        run: |
          job_tmp="$(mktemp -d "${RF_CI_TMPBASE:-$RUNNER_TEMP}/rf-tests.XXXXXX")"
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
          echo "RF_TEST_TMPDIR=$job_tmp" >> "$GITHUB_ENV"

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: archive-sdk
      - name: Run shard
        run: |
          ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --archive-file sdk.tar.zst --workspace-remap . --extract-to . --extract-overwrite --profile ci -E 'not binary(c_abi_smoke)' --partition hash:${{ matrix.shard }}/2

      - name: Clean private test temp directory
        if: always() && runner.environment == 'self-hosted'
        run: |
          case "${RF_TEST_TMPDIR:-}" in "${RF_CI_TMPBASE:-$RUNNER_TEMP}"/rf-tests.*) rm -rf -- "$RF_TEST_TMPDIR" ;; esac
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-sdk-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  test-rest:
    name: Tests (rest ${{ matrix.shard }}/2)
    needs: build-rest
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Use tmpfs for /tmp
        if: runner.environment == 'github-hosted'
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Create private test temp directory
        if: runner.environment == 'self-hosted'
        run: |
          job_tmp="$(mktemp -d "${RF_CI_TMPBASE:-$RUNNER_TEMP}/rf-tests.XXXXXX")"
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
          echo "RF_TEST_TMPDIR=$job_tmp" >> "$GITHUB_ENV"

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: archive-rest
      - name: Run shard
        run: |
          ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --archive-file rest.tar.zst --workspace-remap . --extract-to . --extract-overwrite --profile ci --partition hash:${{ matrix.shard }}/2

      - name: Clean private test temp directory
        if: always() && runner.environment == 'self-hosted'
        run: |
          case "${RF_TEST_TMPDIR:-}" in "${RF_CI_TMPBASE:-$RUNNER_TEMP}"/rf-tests.*) rm -rf -- "$RF_TEST_TMPDIR" ;; esac
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-rest-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  v-sdk-a:
    name: "SDK variant: memory vault and production absence"
    runs-on: ${{ fromJSON(vars.RF_CI_RUNNER == 'github' && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","rf-qa-sandboxed"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and check build prerequisites
        run: |
          missing=0
          for tool in cc c++ make cmake pkg-config perl python3 git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::missing build prerequisite: $tool"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Use tmpfs for /tmp
        if: runner.environment == 'github-hosted'
        # SQLite-heavy tests are fsync bound on the runner disk; their scratch roots live in /tmp.
        run: sudo mount -t tmpfs -o size=5g tmpfs /tmp

      - name: Create private test temp directory
        if: runner.environment == 'self-hosted'
        run: |
          job_tmp="$(mktemp -d "${RF_CI_TMPBASE:-$RUNNER_TEMP}/rf-tests.XXXXXX")"
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
          echo "RF_TEST_TMPDIR=$job_tmp" >> "$GITHUB_ENV"

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-${{ runner.environment }}
          shared-key: v-sdk-a

      - name: Install nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: nextest@0.9.150

      - name: Test (memory vault)
        run: |
          RAMFLUX_ITEST_BUILD=1 cargo nextest run --no-run --profile ci --no-tests=fail -p ramflux-sdk --features itest-memory-vault -E 'test(custody) | test(approve_once_requires_daemon_opt_in_and_refuses_every_second_arm_with_a_typed_error)'
          RAMFLUX_ITEST_BUILD=1 ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-sdk --features itest-memory-vault -E 'test(custody) | test(approve_once_requires_daemon_opt_in_and_refuses_every_second_arm_with_a_typed_error)'

      - name: Keep JUnit (memory vault)
        if: always()
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then cp target/nextest/ci/junit.xml target/nextest/ci/junit-memory-vault.xml; fi

      - name: Test (production absence)
        if: ${{ !cancelled() }}
        run: |
          RAMFLUX_PRODUCTION_BUILD=1 cargo nextest run --no-run --profile ci --no-tests=fail -p ramflux-sdk --lib -E 'test(itest_migration_approve_once_method_is_absent_from_a_production_build)'
          RAMFLUX_PRODUCTION_BUILD=1 ${{ runner.environment != 'github-hosted' && 'bash scripts/ci/private-netns.sh' || '' }} cargo nextest run --profile ci --no-tests=fail -p ramflux-sdk --lib -E 'test(itest_migration_approve_once_method_is_absent_from_a_production_build)'

      - name: Keep JUnit (production absence)
        if: always()
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then cp target/nextest/ci/junit.xml target/nextest/ci/junit-production-absence.xml; fi

      - name: Clean private test temp directory
        if: always() && runner.environment == 'self-hosted'
        run: |
          case "${RF_TEST_TMPDIR:-}" in "${RF_CI_TMPBASE:-$RUNNER_TEMP}"/rf-tests.*) rm -rf -- "$RF_TEST_TMPDIR" ;; esac
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-v-sdk-a
          path: target/nextest/ci/junit-*.xml
          if-no-files-found: ignore

