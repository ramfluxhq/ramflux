name: Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: sec-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22

      # Run the scanner directly: reporting through a separate Checks API request
      # must not turn an otherwise completed audit into an HTTP failure.
      - name: Install cargo-audit
        working-directory: /tmp
        run: cargo install cargo-audit --locked --version 0.23.0

      - name: Audit
        run: cargo audit --deny unsound

  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22

      # Install cargo-deny from crates.io (same pinned version the action used) instead of the
      # action's GitHub-release tarball download, so a release-asset outage cannot block the gate.
      - name: Install cargo-deny
        working-directory: /tmp
        run: cargo install cargo-deny --locked --version 0.19.8

      - name: Cargo deny
        run: cargo deny --all-features check advisories bans licenses sources
