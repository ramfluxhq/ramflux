name: CodeQL

on:
  # Owner workflow 2026-11-23: CI gates only the next -> main promotion and main itself; next is verified by real runs.
  pull_request:
    branches: ["main"]
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 2"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Initialize CodeQL
        uses: github/codeql-action/init@776237d428f23fefc3d9e0fe1962921cbcd53e17
        with:
          languages: rust

      - name: Build
        run: cargo build --workspace

      - name: Analyze
        uses: github/codeql-action/analyze@776237d428f23fefc3d9e0fe1962921cbcd53e17
