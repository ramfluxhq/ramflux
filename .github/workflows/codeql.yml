name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 2"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4f900f43bc6bfc406aac5f37e402badfc55f9342
        with:
          languages: rust

      - name: Build
        run: cargo build --workspace

      - name: Analyze
        uses: github/codeql-action/analyze@4f900f43bc6bfc406aac5f37e402badfc55f9342
