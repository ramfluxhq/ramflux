version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
