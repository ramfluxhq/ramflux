[profile.default]
# A test running longer than 60 s fails: the first 30 s period flags it slow,
# the second terminates it.
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

[profile.ci]
inherits = "default"
fail-fast = false
retries = 1
final-status-level = "flaky"

[test-groups.heavy]
max-threads = 1

# Retrying a real-process crash proof can inherit leaked process/provider state.
[[profile.ci.overrides]]
filter = 'binary(/^e2e_/) | test(linux_vault_) | test(custody::vault::linux::writer::tests::)'
retries = 0

[[profile.ci.overrides]]
filter = 'binary(graceful_shutdown) | binary(e2e_boot_dm) | binary(e2e_resume) | binary(e2e_group) | test(receive_resync_recovers_)'
test-group = "heavy"

[profile.ci.junit]
path = "junit.xml"

# The only test with a real-time floor above 60 s: it proves ten clients behind one IP
# register across two real one-minute challenge-issuance windows (16 per IP per minute),
# and the gateway has no injectable clock. Every other test must finish inside 60 s.
[[profile.default.overrides]]
filter = 'package(ramflux-gateway) & test(=custody::tests::nat::gateway::ten_existing_sdk_clients_behind_one_ip_register_in_waves_with_ninety_seconds_per_flight)'
slow-timeout = { period = "60s", terminate-after = 2 }

# Durable overflow recovery applies 266 authenticated inbox entries (the 256-entry session
# buffer plus overflow) through the real writer, about 0.2 s each on a loaded runner. Steady
# progress is policed by recover()'s 10 s silence guard; this only widens the kill window to
# 120 s. recover() fails with diagnostics at 100 s, before nextest terminates the process.
[[profile.default.overrides]]
filter = 'package(ramflux-sdk) & test(/^bus::account_runtime::tests::receive_resync::receive_resync_recovers_/)'
slow-timeout = { period = "60s", terminate-after = 2 }

# CLI e2e boots four node processes plus rf daemons; ignored by default, CI-only.
[[profile.default.overrides]]
filter = 'binary(e2e_boot_dm) | binary(e2e_resume) | binary(e2e_group)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The configured router test includes a 2,000-connection lifecycle check.
[profile.shutdown]
inherits = "ci"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.shutdown.junit]
path = "junit.xml"

# This pairing row owns four real product services and its own 120-second deadline.
[[profile.default.overrides]]
filter = 'package(ramflux-federation) & test(=pairing_http::continuity_tests::native_devices::history::pairing_tls_enrollment_delivers_existing_dm_through_ordinary_object_relay)'
slow-timeout = { period = "60s", terminate-after = 2 }

# These cold ownership rows perform several independent encrypted generation reopenings.
# Scoped QA measures 70-75 seconds for the full row; each individual cut retains its
# own 60-second semantic deadline, and the aggregate runner cap remains below 5 minutes.
[[profile.default.overrides]]
filter = 'package(ramflux-sdk) & (test(=custody::pairing::component_tests::generation::recovery::tests::stage_union::pairing_full_stage_link_and_union_install_crash_cuts) | test(=custody::pairing::component_tests::generation::recovery::tests::primary_transfer_full_generation_publication_crash_cuts))'
slow-timeout = { period = "60s", terminate-after = 3 }
