node_id = "localhost"
service_id = "ramflux-notify"
redb_path = "/var/lib/ramflux/notify/notify.redb"

[mesh]
listen_addr = "0.0.0.0:7443"
ca_cert = "/etc/ramflux/mesh/ca.pem"
service_cert = "/etc/ramflux/mesh/notify.pem"
service_key = "/etc/ramflux/mesh/notify-key.pem"
allowed_service_ids = [
  "ramflux-gateway",
  "ramflux-router",
  "ramflux-notify",
  "ramflux-federation",
  "ramflux-relay",
  "ramflux-signaling",
  "ramflux-retention",
]

[mesh.endpoints]
gateway = "ramflux-gateway:7443"
router = "ramflux-router:7443"
router-async = "ramflux-router:17444"
notify = "ramflux-notify:7443"
federation = "ramflux-federation:7443"
relay = "ramflux-relay:7443"
signaling = "ramflux-signaling:7443"
retention = "ramflux-retention:7443"

[gateway]
public_listen_addr = "0.0.0.0:443"

[signaling]
turn_udp_addr = "0.0.0.0:3478"
turn_tcp_addr = "0.0.0.0:3478"

[send_authority]
root_budget = 4096

[send_authority.origins]
"spiffe://localhost/ramflux-router" = "ramflux-router:17444"
"spiffe://localhost/ramflux-gateway/ramflux-gateway" = "ramflux-gateway:7443"
