node_id = "localhost"
service_id = "ramflux-federation"
redb_path = "/var/lib/ramflux/federation/federation.redb"

# Shared with the router. Federation publishes this list and does not infer it from mesh addresses.
gateway_client_capabilities = [
  "gateway.session_push.v1",
  "gateway.ephemeral.v1",
]

[mesh]
listen_addr = "0.0.0.0:7443"
ca_cert = "/etc/ramflux/mesh/ca.pem"
service_cert = "/etc/ramflux/mesh/federation.pem"
service_key = "/etc/ramflux/mesh/federation-key.pem"
allowed_service_ids = [
  "ramflux-gateway",
  "ramflux-router",
  "ramflux-notify",
  "ramflux-federation",
  "ramflux-relay",
  "ramflux-signaling",
  "ramflux-retention",
]

[mesh.endpoints]
gateway = "ramflux-gateway:7443"
router = "ramflux-router:7443"
notify = "ramflux-notify:7443"
federation = "ramflux-federation:7443"
relay = "ramflux-relay:7443"
signaling = "ramflux-signaling:7443"
retention = "ramflux-retention:7443"

[gateway]
public_listen_addr = "0.0.0.0:443"

[signaling]
turn_udp_addr = "0.0.0.0:3478"
turn_tcp_addr = "0.0.0.0:3478"

# Central push (rfc-push-1), disabled by default. Uncomment on a node that uses the central service.
# Requires [node_report] (centre id, edge address, CA). Paths must be absolute.
# [push_central]
# enabled = true
# state_file = "/var/lib/ramflux/push_central.json"
# handoff_socket = "/var/lib/ramflux/push/handoff.sock"
